<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login</title></head>
<body>
  <h1>Sign in</h1>
  {% if error %}<p style="color:red" data-testid="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label>Username <input name="username" data-testid="username"></label><br>
    <label>Password <input name="password" type="password" data-testid="password"></label><br>
    <button type="submit" data-testid="submit">Sign in</button>
  </form>
</body>
</html>
